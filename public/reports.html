    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;

        select {

            background: #0f172a;

        .filter-btn {

            grid-template-columns: repeat(4,1fr);

            margin-bottom: 22px;
        }

        .stat-card {
            background: white;
            border-radius: 18px;

            box-shadow: 0 10px 30px rgba(15,23,42,.06);

        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99,102,241,.12);
            color: #6366f1;
            margin-bottom: 15px;
        }

        .stat-card h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 13px;
            color: #64748b;
        }

        /* CHARTS */

        .charts-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 17px;
        }

        .chart-box {
            height: 320px;
            position: relative;
        }

        .empty {
            text-align: center;
            padding: 70px 20px;

        }

        .empty i {
            font-size: 45px;

        }

        /* RESPONSIVE */

        @media(max-width: 1000px) {

                grid-template-columns: 1fr;

        @media(max-width: 700px) {

            }

            .brand h2,

                display: none;

                justify-content: center;

                justify-content: center;

            .main {
                margin-left: 70px;

                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-wallet"></i>
            </div>

            <h2>Expense Tracker</h2>
        </div>

        <div class="nav-title">Menu</div>

        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>

        <a href="index.html#transactions" class="nav-item">
            <i class="fa-solid fa-receipt"></i>
            <span>Transactions</span>
        </a>

        <a href="reports.html" class="nav-item active">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Reports</span>
        </a>

        <a href="insights.html" class="nav-item">
            <i class="fa-solid fa-lightbulb"></i>
            <span>Insights</span>
        </a>

        <a href="accounts.html" class="nav-item">
            <i class="fa-solid fa-wallet"></i>
            <span>Accounts</span>
        </a>

        <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>

        <button
            class="nav-item logout-btn"
            type="button"
            onclick="logoutUser()"
        >
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <div class="page-title">
                <h1>Reports</h1>
                <p>Analyze your income and expenses</p>
            </div>

            <div class="top-actions">

                <button
                    class="top-btn"
                    onclick="toggleTheme()"
                    title="Toggle theme"
                >
                    <i class="fa-solid fa-moon"></i>
                </button>

            </div>

        </div>


        <!-- FILTER -->

        <div class="filter-card">

            <div class="filter-group">
                <label>From</label>

                <input
                    type="date"
                    id="fromDate"
                >
            </div>

            <div class="filter-group">
                <label>To</label>

                <input
                    type="date"
                    id="toDate"
                >
            </div>

            <div class="filter-group">
                <label>Type</label>

                <select id="typeFilter">
                    <option value="all">All Transactions</option>
                    <option value="income">Income</option>
                    <option value="expense">Expenses</option>
                </select>
            </div>

            <button
                class="filter-btn"
                onclick="generateReport()"
            >
                <i class="fa-solid fa-filter"></i>
                Generate Report
            </button>

        </div>


        <!-- STATS -->

        <div class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-arrow-down"></i>
                </div>

                <h3 id="totalIncome">₹0</h3>

                <p>Total Income</p>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-arrow-up"></i>
                </div>

                <h3 id="totalExpense">₹0</h3>

                <p>Total Expenses</p>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-scale-balanced"></i>
                </div>

                <h3 id="balance">₹0</h3>

                <p>Balance</p>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-receipt"></i>
                </div>

                <h3 id="transactionCount">0</h3>

                <p>Transactions</p>

            </div>

        </div>


        <!-- CHARTS -->

        <div class="charts-grid">

            <div class="card">

                <div class="card-header">

                    <h2>Income vs Expenses</h2>

                    <i class="fa-solid fa-chart-line"></i>

                </div>

                <div class="chart-box">
                    <canvas id="incomeExpenseChart"></canvas>
                </div>

            </div>


            <div class="card">

                <div class="card-header">

                    <h2>Expense Categories</h2>

                    <i class="fa-solid fa-chart-pie"></i>

                </div>

                <div class="chart-box">
                    <canvas id="categoryChart"></canvas>
                </div>

            </div>

        </div>

    </main>

</div>


<script>

    /* =========================
       LOGIN PROTECTION
    ========================= */

    if (
        localStorage.getItem("expenseTrackerLoggedIn") !== "true"
    ) {
        window.location.href = "login.html";
    }


    /* =========================
       LOGOUT
    ========================= */

    function logoutUser() {

        localStorage.removeItem("expenseTrackerLoggedIn");

        localStorage.removeItem("expenseTrackerCurrentUser");

        window.location.href = "login.html";
    }


    /* =========================
       THEME
    ========================= */

    function toggleTheme() {

        document.body.classList.toggle("dark");

        localStorage.setItem(
            "expenseTrackerTheme",
            document.body.classList.contains("dark")
                ? "dark"
                : "light"
        );
    }


    if (
        localStorage.getItem("expenseTrackerTheme")
        === "dark"
    ) {
        document.body.classList.add("dark");
    }


    /* =========================
       GET TRANSACTIONS
    ========================= */

    function getTransactions() {

        const possibleKeys = [
            "expenseTrackerTransactions",
            "transactions",
            "expenses"
        ];

        for (const key of possibleKeys) {

            try {

                const data =
                    localStorage.getItem(key);

                if (data) {

                    const parsed =
                        JSON.parse(data);

                    if (Array.isArray(parsed)) {
                        return parsed;
                    }

                }

            } catch (error) {

                console.error(error);

            }
        }

        return [];
    }


    /* =========================
       NORMALIZE TRANSACTION
    ========================= */

    function normalizeTransaction(transaction) {

        const amount =
            Number(
                transaction.amount ??
                transaction.value ??
                0
            );

        const type =
            String(
                transaction.type ??
                transaction.transactionType ??
                "expense"
            ).toLowerCase();

        const category =
            transaction.category ??
            "Other";

        const date =
            transaction.date ??
            transaction.createdAt ??
            "";

        return {
            amount: isNaN(amount) ? 0 : amount,
            type: type,
            category: category,
            date: date
        };
    }


    /* =========================
       GENERATE REPORT
    ========================= */

    let incomeExpenseChart = null;
    let categoryChart = null;


    function generateReport() {

        let transactions =
            getTransactions()
            .map(normalizeTransaction);


        const from =
            document.getElementById("fromDate").value;

        const to =
            document.getElementById("toDate").value;

        const selectedType =
            document.getElementById("typeFilter").value;


        /* DATE FILTER */

        if (from) {

            transactions =
                transactions.filter(
                    transaction =>
                        transaction.date >= from
                );

        }


        if (to) {

            transactions =
                transactions.filter(
                    transaction =>
                        transaction.date <= to
                );

        }


        /* TYPE FILTER */

        if (selectedType !== "all") {

            transactions =
                transactions.filter(
                    transaction =>
                        transaction.type === selectedType
                );

        }


        let income = 0;
        let expense = 0;

        const categories = {};


        transactions.forEach(transaction => {

            if (transaction.type === "income") {

                income += transaction.amount;

            } else {

                expense += transaction.amount;

                if (
                    !categories[
                        transaction.category
                    ]
                ) {
                    categories[
                        transaction.category
                    ] = 0;
                }

                categories[
                    transaction.category
                ] += transaction.amount;

            }

        });


        const balance =
            income - expense;


        /* UPDATE STATS */

        document.getElementById("totalIncome")
            .textContent =
            "₹" + income.toLocaleString("en-IN");

        document.getElementById("totalExpense")
            .textContent =
            "₹" + expense.toLocaleString("en-IN");

        document.getElementById("balance")
            .textContent =
            "₹" + balance.toLocaleString("en-IN");

        document.getElementById("transactionCount")
            .textContent =
            transactions.length;


        /* CHART 1 */

        if (incomeExpenseChart) {
            incomeExpenseChart.destroy();
        }


        incomeExpenseChart =
            new Chart(
                document.getElementById(
                    "incomeExpenseChart"
                ),
                {
                    type: "bar",

                    data: {

                        labels: [
                            "Income",
                            "Expenses"
                        ],

                        datasets: [
                            {
                                label: "Amount",

                                data: [
                                    income,
                                    expense
                                ]
                            }
                        ]

                    },

                    options: {

                        responsive: true,

                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                display: false
                            }
                        }

                    }

                }
            );


        /* CHART 2 */

        if (categoryChart) {
            categoryChart.destroy();
        }


        const categoryLabels =
            Object.keys(categories);

        const categoryValues =
            Object.values(categories);


        if (categoryLabels.length > 0) {

            categoryChart =
                new Chart(
                    document.getElementById(
                        "categoryChart"
                    ),
                    {
                        type: "doughnut",

                        data: {

                            labels:
                                categoryLabels,

                            datasets: [
                                {
                                    data:
                                        categoryValues
                                }
                            ]

                        },

                        options: {

                            responsive: true,

                            maintainAspectRatio: false,

                            plugins: {
                                legend: {
                                    position: "bottom"
                                }
                            }

                        }

                    }
                );

        }

    }


    /* =========================
       INITIAL REPORT
    ========================= */

    generateReport();

</script>

</body>
</html>
