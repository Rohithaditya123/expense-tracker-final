<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Accounts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 20%, rgba(99,102,241,.20), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(168,85,247,.18), transparent 30%),
                #f5f7fb;
            color: #1e293b;
        }

        body.dark {
            background: #0f172a;
            color: #f8fafc;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            min-height: 100vh;
            padding: 25px 16px;
            background: rgba(255,255,255,.85);
            border-right: 1px solid rgba(15,23,42,.08);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        body.dark .sidebar {
            background: #111827;
            border-color: #1f2937;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
            padding: 0 8px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: linear-gradient(135deg,#6366f1,#8b5cf6);
        }

        .brand h2 {
            font-size: 18px;
        }

        .nav-title {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin: 0 10px 10px;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 15px;
            margin-bottom: 5px;
            border-radius: 12px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: .25s ease;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .nav-item:hover {
            background: rgba(99,102,241,.10);
            color: #6366f1;
            transform: translateX(3px);
        }

        .nav-item.active {
            background: linear-gradient(
                135deg,
                rgba(99,102,241,.15),
                rgba(139,92,246,.10)
            );
            color: #6366f1;
        }

        .logout-btn {
            margin-top: 25px;
        }

        .logout-btn:hover {
            background: rgba(239,68,68,.10);
            color: #ef4444;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .page-title p {
            color: #64748b;
            font-size: 14px;
        }

        body.dark .page-title p {
            color: #94a3b8;
        }

        .top-btn {
            border: none;
            background: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(15,23,42,.06);
        }

        body.dark .top-btn {
            background: #1e293b;
            color: white;
        }

        /* OVERVIEW STAT */
        .total-balance-card {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 18px;
            padding: 30px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(99,102,241,.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .total-balance-card p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .total-balance-card h2 {
            font-size: 36px;
        }

        .total-balance-icon {
            font-size: 48px;
            opacity: 0.2;
        }

        /* CONTENT GRID */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15,23,42,.06);
            height: fit-content;
        }

        body.dark .card {
            background: #1e293b;
        }

        .card-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        body.dark .card-header {
            border-color: #334155;
        }

        .card-header h2 {
            font-size: 18px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        body.dark .form-group label {
            color: #94a3b8;
        }

        input, select {
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            background: #f8fafc;
            width: 100%;
        }

        body.dark input, body.dark select {
            background: #0f172a;
            border-color: #334155;
            color: white;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99,102,241,.3);
        }

        /* ACCOUNT LIST */
        .account-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .account-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        body.dark .account-item {
            background: #0f172a;
            border-color: #334155;
        }

        .account-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .account-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99,102,241,.12);
            color: #6366f1;
            font-size: 18px;
        }

        .account-details h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .account-details p {
            font-size: 13px;
            color: #64748b;
        }

        body.dark .account-details p {
            color: #94a3b8;
        }

        .account-balance {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .account-balance h3 {
            font-size: 18px;
        }

        .account-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 6px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .action-btn.edit {
            color: #3b82f6;
        }
        .action-btn.edit:hover {
            background: rgba(59,130,246,.1);
        }

        .action-btn.delete {
            color: #ef4444;
        }
        .action-btn.delete:hover {
            background: rgba(239,68,68,.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
        }

        /* RESPONSIVE */
        @media(max-width: 1000px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 700px) {
            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .brand h2,
            .nav-item span,
            .nav-title {
                display: none;
            }
            .brand { justify-content: center; }
            .nav-item { justify-content: center; }

            .main {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 20px;
            }

            .account-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .account-balance {
                width: 100%;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h2>Expense Tracker</h2>
        </div>

        <div class="nav-title">Menu</div>

        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>
        <a href="index.html#transactions" class="nav-item">
            <i class="fa-solid fa-receipt"></i>
            <span>Transactions</span>
        </a>
        <a href="reports.html" class="nav-item">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Reports</span>
        </a>
        <a href="insights.html" class="nav-item">
            <i class="fa-solid fa-lightbulb"></i>
            <span>Insights</span>
        </a>
        <a href="accounts.html" class="nav-item active">
            <i class="fa-solid fa-wallet"></i>
            <span>Accounts</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>

        <button class="nav-item logout-btn" type="button" onclick="logoutUser()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </button>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <div class="topbar">
            <div class="page-title">
                <h1>Accounts</h1>
                <p>Manage your bank, cash, and UPI balances</p>
            </div>
            <button class="top-btn" onclick="toggleTheme()" title="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <!-- TOTAL BALANCE -->
        <div class="total-balance-card">
            <div>
                <p>Total Available Balance</p>
                <h2 id="totalBalanceDisplay">₹0</h2>
            </div>
            <i class="fa-solid fa-vault total-balance-icon"></i>
        </div>

        <div class="content-grid">
            
            <!-- FORM CARD -->
            <div class="card">
                <div class="card-header">
                    <h2 id="formTitle">Add New Account</h2>
                </div>
                
                <form id="accountForm" onsubmit="saveAccount(event)">
                    <input type="hidden" id="accountId">
                    
                    <div class="form-group">
                        <label>Account Name</label>
                        <input type="text" id="accName" placeholder="e.g. HDFC Bank, GPay, Wallet" required>
                    </div>

                    <div class="form-group">
                        <label>Account Type</label>
                        <select id="accType" required>
                            <option value="Bank">Bank Account</option>
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI / Mobile</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Current Balance</label>
                        <input type="number" id="accBalance" placeholder="0" step="0.01" required>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Save Account</button>
                    <button type="button" class="btn-submit" id="cancelBtn" style="display: none; background: #64748b; margin-top: 10px;" onclick="resetForm()">Cancel Edit</button>
                </form>
            </div>

            <!-- ACCOUNTS LIST CARD -->
            <div class="card">
                <div class="card-header">
                    <h2>Your Accounts</h2>
                </div>
                
                <div class="account-list" id="accountList">
                    <!-- Accounts render here via JS -->
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    /* =========================
       LOGIN PROTECTION
    ========================= */
    if (localStorage.getItem("expenseTrackerLoggedIn") !== "true") {
        window.location.href = "login.html";
    }

    /* =========================
       LOGOUT
    ========================= */
    function logoutUser() {
        localStorage.removeItem("expenseTrackerLoggedIn");
        localStorage.removeItem("expenseTrackerCurrentUser");
        window.location.href = "login.html";
    }

    /* =========================
       THEME
    ========================= */
    function toggleTheme() {
        document.body.classList.toggle("dark");
        localStorage.setItem(
            "expenseTrackerTheme",
            document.body.classList.contains("dark") ? "dark" : "light"
        );
    }

    if (localStorage.getItem("expenseTrackerTheme") === "dark") {
        document.body.classList.add("dark");
    }

    /* =========================
       ACCOUNTS LOGIC
    ========================= */
    
    // Retrieve accounts from localStorage
    function getAccounts() {
        const stored = localStorage.getItem("expenseTrackerAccounts");
        return stored ? JSON.parse(stored) : [];
    }

    // Save array to localStorage
    function setAccounts(accountsArray) {
        localStorage.setItem("expenseTrackerAccounts", JSON.stringify(accountsArray));
        renderAccounts();
    }

    // Get exact icon based on account type
    function getAccountIcon(type) {
        if (type === "Cash") return `<i class="fa-solid fa-money-bill-wave"></i>`;
        if (type === "UPI") return `<i class="fa-solid fa-mobile-screen"></i>`;
        return `<i class="fa-solid fa-building-columns"></i>`; // Default Bank
    }

    // Handle Form Submit (Add / Edit)
    function saveAccount(e) {
        e.preventDefault();
        
        const idInput = document.getElementById("accountId").value;
        const nameInput = document.getElementById("accName").value;
        const typeInput = document.getElementById("accType").value;
        const balanceInput = parseFloat(document.getElementById("accBalance").value);

        let accounts = getAccounts();

        if (idInput) {
            // EDIT EXISTING
            const index = accounts.findIndex(acc => acc.id == idInput);
            if (index !== -1) {
                accounts[index].name = nameInput;
                accounts[index].type = typeInput;
                accounts[index].balance = balanceInput;
            }
        } else {
            // ADD NEW
            const newAccount = {
                id: Date.now(),
                name: nameInput,
                type: typeInput,
                balance: balanceInput
            };
            accounts.push(newAccount);
        }

        setAccounts(accounts);
        resetForm();
    }

    // Populate form for editing
    function editAccount(id) {
        const accounts = getAccounts();
        const accountToEdit = accounts.find(acc => acc.id == id);
        
        if (accountToEdit) {
            document.getElementById("accountId").value = accountToEdit.id;
            document.getElementById("accName").value = accountToEdit.name;
            document.getElementById("accType").value = accountToEdit.type;
            document.getElementById("accBalance").value = accountToEdit.balance;

            document.getElementById("formTitle").innerText = "Edit Account";
            document.getElementById("submitBtn").innerText = "Update Account";
            document.getElementById("cancelBtn").style.display = "block";
        }
    }

    // Delete account
    function deleteAccount(id) {
        if(confirm("Are you sure you want to delete this account?")) {
            let accounts = getAccounts();
            accounts = accounts.filter(acc => acc.id != id);
            setAccounts(accounts);
        }
    }

    // Reset Form
    function resetForm() {
        document.getElementById("accountForm").reset();
        document.getElementById("accountId").value = "";
        document.getElementById("formTitle").innerText = "Add New Account";
        document.getElementById("submitBtn").innerText = "Save Account";
        document.getElementById("cancelBtn").style.display = "none";
    }

    // Render Accounts to UI
    function renderAccounts() {
        const accounts = getAccounts();
        const accountList = document.getElementById("accountList");
        let totalBalance = 0;

        if (accounts.length === 0) {
            accountList.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-wallet"></i>
                    <h3>No accounts added</h3>
                    <p>Add your first account to start tracking balances.</p>
                </div>
            `;
            document.getElementById("totalBalanceDisplay").innerText = "₹0";
            return;
        }

        let html = "";
        accounts.forEach(acc => {
            totalBalance += acc.balance;
            
            html += `
                <div class="account-item">
                    <div class="account-info">
                        <div class="account-icon">
                            ${getAccountIcon(acc.type)}
                        </div>
                        <div class="account-details">
                            <h4>${acc.name}</h4>
                            <p>${acc.type}</p>
                        </div>
                    </div>
                    <div class="account-balance">
                        <h3>₹${acc.balance.toLocaleString("en-IN")}</h3>
                        <div class="account-actions">
                            <button class="action-btn edit" onclick="editAccount(${acc.id})" title="Edit">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="action-btn delete" onclick="deleteAccount(${acc.id})" title="Delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });

        accountList.innerHTML = html;
        document.getElementById("totalBalanceDisplay").innerText = "₹" + totalBalance.toLocaleString("en-IN");
    }

    // Initialize View
    renderAccounts();

</script>
</body>
</html>
